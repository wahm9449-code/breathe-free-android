function lv(){let i=0;LV.forEach((l,j)=>{if(S.pts>=l[0])i=j});const n=LV[i+1];return{i,name:LV[i][1],pct:n?Math.round((S.pts-LV[i][0])/(n[0]-LV[i][0])*100):100,next:n?n[0]-S.pts:0}}

function games(){const G=[["🫁","رحلة الرئة","استكشف الرئة بين الصحة والتدخين","lgS(0)"],["🌬️","تحدي النفس النقي","عادات يومية بديلة","draw(chg)"],["✅","صح أم خطأ؟","اختبر معلوماتك بسرعة","tfS()"],["🧠","اختبر معلوماتك","أسئلة بنقاط ومكافآت","qzS(0)"],["🎯","صيد المعلومات","اصطد الحقائق وتجنّب الخرافات","huS()"]];return `<h2>الألعاب والتحديات</h2>`+G.map(x=>`<button class="card gm" onclick="${x[3]}"><span class="ic">${x[0]}</span><span><b>${x[1]}</b><br><small>${x[2]}</small></span></button>`).join("")+`<h3>📋 اختبارات قصيرة</h3><div class="grid2">`+QZ.map((q,i)=>`<button class="card gm sq" onclick="qzS(${i})">${q.n}</button>`).join("")+`</div>`}

const q=Q[i];D2(`${BK}<h2>${QZ[t].n}</h2><p class="mu">سؤال ${i+1} من ${Q.length} — كل إجابة صحيحة 5 نقاط</p><div class="card q">${q[0]}</div>${q[1].map((o,j)=>`<button class="opt" onclick="qzA(${j},this)">${o}</button>`).join("")}<div id="fb"></div>`)}
